name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with test dependencies
        run: pip install -e ".[test]"
      - name: Run test suite
        run: pytest

  shellcheck:
    name: shellcheck templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Only the scripts this repo authors. mvnw/gradlew are vendored
      # upstream wrappers and are deliberately not linted.
      # -P SCRIPTDIR resolves the sourced phase2-lib.sh relative to the
      # script's own directory, which holds in this repo and in scaffolded
      # projects alike. -S warning gates on warnings+errors only: runner
      # shellcheck versions differ from dev machines on info/style notes
      # (e.g. SC2015 on the intentional `[ -n .. ] && kill .. || true`
      # signal-handler lines), and those must not flap the build.
      - name: shellcheck phase2 scripts
        run: shellcheck -x -P SCRIPTDIR -S warning src/nimbus_tiers/templates/phase2*.sh

  package:
    name: wheel builds and installs cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          # A stale build/ directory can leak deleted/renamed template files
          # into the wheel (setuptools reuses it), so start clean.
          rm -rf build/
          pip install build
          python -m build --wheel --outdir dist/
      - name: Wheel template contents must exactly match the source tree
        run: |
          python -m zipfile -l dist/*.whl \
            | awk '{print $1}' | grep '^nimbus_tiers/templates/.*[^/]$' \
            | sed 's|^nimbus_tiers/templates/||' | sort > wheel-templates.txt
          git ls-files src/nimbus_tiers/templates \
            | sed 's|^src/nimbus_tiers/templates/||' | sort > source-templates.txt
          diff source-templates.txt wheel-templates.txt
      - name: Smoke test - scaffold a project from the installed wheel
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install dist/*.whl
          mkdir /tmp/smoke && cd /tmp/smoke
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null
          export GIT_AUTHOR_NAME=ci GIT_AUTHOR_EMAIL=ci@example.com
          export GIT_COMMITTER_NAME=ci GIT_COMMITTER_EMAIL=ci@example.com
          /tmp/smoke-venv/bin/nimbus-generate demo --stack python --path-type light-local
          test -f demo/.aider.conf.yml
          test -f demo/phase2.sh
          test -x demo/phase2.sh
          test -d demo/.git
          grep -q "test-cmd: pytest -x --no-header" demo/.aider.conf.yml
          grep -q "Path B (Light Local)" demo/.aider.conf.yml
