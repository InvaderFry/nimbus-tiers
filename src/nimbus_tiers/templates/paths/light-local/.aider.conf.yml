# Aider configuration — Path B (Light Local)
# Default executor: a local coder model served by Ollama's OpenAI-compatible
# endpoint on localhost:11434. Pull the model first:
#   ollama pull qwen2.5-coder:14b
# NOTE: unlike TabbyAPI's single-model mode, Ollama DOES select by name — the
# model below must match a tag from `ollama list` (strip the `openai/` prefix,
# which only tells Aider to speak the OpenAI protocol to the base URL).
# Mid-session swaps:
#   /model groq/llama-3.3-70b-versatile     # Tier 2 fallback
#   /model anthropic/claude-opus-4-7        # Tier 3 escalation
#   /model groq/llama-3.1-8b-instant        # Tier 0 trivial

model: openai/qwen2.5-coder:14b
openai-api-base: http://localhost:11434/v1
openai-api-key: notneeded

# Safe-mode defaults — phase2.sh owns commits and verification.
auto-commits: false
auto-test: false
test-cmd: {{TEST_CMD}}

# Ollama serving checklist (the settings that actually prevent loops):
#   - Context length >= 16384. Ollama's small default (2-4K depending on
#     version) truncates Aider's prompt mid-file — the known root cause of
#     degenerate repetition loops and phantom SEARCH/REPLACE blocks. Set
#     OLLAMA_CONTEXT_LENGTH=16384 on the server process, or bake a Modelfile
#     with `PARAMETER num_ctx 16384`.
#   - OLLAMA_FLASH_ATTENTION=1 and OLLAMA_KV_CACHE_TYPE=q8_0 — never a 4-bit
#     or lower KV cache for code generation. `nimbus-setup` walks you through
#     both (see the ollama-config step).
# phase2.sh's preflight verifies the endpoint is reachable, but Ollama does
# not expose TabbyAPI's /v1/model card, so the context-length floor check is
# skipped on this path — the num_ctx setting above is on you.
map-tokens: 0
edit-format: diff

# Read-only files that should always be in context for any session.
# Per-feature step files are added by phase2.sh, not here.
read:
  - CONTEXT.md
